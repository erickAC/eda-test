services:
  management:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
  db:
    image: postgres:15
    ports:
      -  "5432:5432"
    environment:
      POSTGRES_DB: order-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres